            <div class="card p-5 shadow-sm">

                <form>

                    <div class="mb-3">
                        <label class="form-label">Name</label>
                        <input type="text" class="form-control" placeholder="Your Name">

                    <button class="btn btn-dark w-100">
                        Send Message

                </form>

                <hr class="my-4">

                <div class="text-center">

                    <p>

                        <strong>GitHub:</strong><br>

            </div>

        </div>

    </div>

</div>
